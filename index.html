<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genesis Survivor Engine (GSE-v1) - POC</title>
    <meta name="description" content="Un moteur de jeu Survivor / Bullet Heaven haute performance sans dépendance.">
    <link rel="stylesheet" href="style.css">

    <!-- JSON-LD SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Genesis Survivor Engine",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
</head>
<body>

    <!-- Structure Sémantique pour le SEO -->
    <main id="game-container">
        <header class="sr-only">
            <h1>Genesis Survivor Game</h1>
        </header>

        <!-- Canvas Principal -->
        <canvas id="game-canvas"></canvas>

        <!-- UI Overlay (HTML/CSS) -->
        <div id="ui-layer">

            <!-- Ecrans de jeu -->
            <div id="menu-screen" class="screen">
                <h1>GENESIS SURVIVOR</h1>
                <button id="start-btn" class="btn">START GAME</button>
                <button id="shop-btn" class="btn" style="margin-top: 10px; font-size: 18px;">SHOP (META)</button>
            </div>

            <div id="shop-screen" class="screen hidden">
                <h1>SHOP</h1>
                <p>GOLD: <span id="shop-gold" style="color: gold;">0</span></p>

                <div class="shop-item">
                    <span>HEALTH +20</span>
                    <span id="lvl-health_boost">Lvl: 0/5</span>
                    <button id="buy-health_boost" class="btn-small"><span id="cost-health_boost">100 G</span></button>
                </div>
                <div class="shop-item">
                    <span>DAMAGE +10%</span>
                    <span id="lvl-damage_boost">Lvl: 0/5</span>
                    <button id="buy-damage_boost" class="btn-small"><span id="cost-damage_boost">200 G</span></button>
                </div>
                <div class="shop-item">
                    <span>SPEED +10</span>
                    <span id="lvl-speed_boost">Lvl: 0/3</span>
                    <button id="buy-speed_boost" class="btn-small"><span id="cost-speed_boost">150 G</span></button>
                </div>
                <div class="shop-item">
                    <span>WHIP WEAPON</span>
                    <span id="lvl-unlock_whip">Lvl: 0/1</span>
                    <button id="buy-unlock_whip" class="btn-small"><span id="cost-unlock_whip">500 G</span></button>
                </div>

                <button id="back-btn" class="btn" style="margin-top: 30px;">BACK</button>
            </div>

            <div id="gameover-screen" class="screen hidden">
                <h1>GAME OVER</h1>
                <p>FINAL SCORE: <span id="final-score">0</span></p>
                <button id="restart-btn" class="btn">TRY AGAIN</button>
            </div>

            <!-- HUD (Visible uniquement en jeu, géré par CSS si on veut, ou JS) -->
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>

            <div id="xp-bar-container">
                <div id="xp-fill"></div>
                <div id="level-display">LVL 1</div>
            </div>

            <div id="score-display">SCORE: 00000</div>
        </div>

        <!-- Description Invisible pour l'Accessibilité et le SEO (Mise à jour par SEOSystem) -->
        <div id="game-description" class="visually-hidden" aria-live="polite">
            Initialisation du moteur Genesis Survivor...
        </div>
    </main>

    <!-- Point d'entrée JS (Module) -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
